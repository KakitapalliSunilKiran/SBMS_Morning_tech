spring:
  application:
    name: ECloudApiGateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: api-1
              uri: lb://EORDSPRINGBOOT-1
              predicates:
                - Path=/ord/**

server:
  port: 7778

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka